// ---------- helpers ----------

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function fmtMoney(n, currency) {
  return new Intl.NumberFormat("es-ES", {
    style: "currency",
    currency: currency || "EUR",
    maximumFractionDigits: 2,
  }).format(Number.isFinite(n) ? n : 0);
}

const fmtPct = (n) => `${n >= 0 ? "+" : ""}${(Number.isFinite(n) ? n : 0).toFixed(2)}%`;

const fmtDate = (iso) => {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
};

const startOfWeek = (d) => {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
};

const addMonths = (iso, n) => {
  const d = new Date(iso + "T00:00:00");
  d.setMonth(d.getMonth() + n);
  return d;
};

// Regla de los 2 meses (art. 33.5.f LIRPF): una pérdida por venta de valores
// cotizados no es computable si se recompran valores homogéneos en los 2
// meses anteriores o posteriores a la venta.
const isWithinTwoMonths = (fechaVentaISO, fechaOtraISO) => {
  if (!fechaVentaISO || !fechaOtraISO) return false;
  const other = new Date(fechaOtraISO + "T00:00:00");
  const lower = addMonths(fechaVentaISO, -2);
  const upper = addMonths(fechaVentaISO, 2);
  return other >= lower && other <= upper;
};

const calcTax = (base) => {
  if (!Number.isFinite(base) || base <= 0) return 0;
  let remaining = base;
  let tax = 0;
  let lower = 0;
  for (const b of TAX_BRACKETS) {
    const chunk = Math.min(remaining, b.upTo - lower);
    if (chunk > 0) {
      tax += chunk * b.rate;
      remaining -= chunk;
    }
    lower = b.upTo;
    if (remaining <= 0) break;
  }
  return tax;
};

const calcPnl = (op) => {
  if (op.estado === "abierta") return { neto: null, pct: null, unrealizedNeto: null, unrealizedPct: null };
  const entrada = Number(op.entrada) || 0;
  const salida = Number(op.salida) || 0;
  const cantidad = Number(op.cantidad) || 0;
  const comision = Number(op.comision) || 0;
  const bruto = op.direccion === "corta" ? (entrada - salida) * cantidad : (salida - entrada) * cantidad;
  const neto = bruto - comision;
  const invertido = entrada * cantidad;
  const pct = invertido !== 0 ? (neto / invertido) * 100 : 0;
  return { neto, pct };
};

const calcUnrealized = (op) => {
  if (op.estado !== "abierta" || op.precioActual === "" || op.precioActual == null) return null;
  const entrada = Number(op.entrada) || 0;
  const actual = Number(op.precioActual) || 0;
  const cantidad = Number(op.cantidad) || 0;
  const bruto = op.direccion === "corta" ? (entrada - actual) * cantidad : (actual - entrada) * cantidad;
  const invertido = entrada * cantidad;
  const pct = invertido !== 0 ? (bruto / invertido) * 100 : 0;
  return { neto: bruto, pct };
};

const calcRiesgo = (op) => {
  const entrada = Number(op.entrada) || 0;
  const sl = Number(op.stopLoss) || 0;
  const cantidad = Number(op.cantidad) || 0;
  if (!op.stopLoss || !entrada || !cantidad) return null;
  const riesgo = op.direccion === "corta" ? (sl - entrada) * cantidad : (entrada - sl) * cantidad;
  return Math.abs(riesgo);
};

const calcRatioRB = (op) => {
  const entrada = Number(op.entrada) || 0;
  const sl = Number(op.stopLoss) || 0;
  const tp = Number(op.takeProfit) || 0;
  if (!op.stopLoss || !op.takeProfit || !entrada) return null;
  const riesgo = Math.abs(op.direccion === "corta" ? sl - entrada : entrada - sl);
  const beneficio = Math.abs(op.direccion === "corta" ? entrada - tp : tp - entrada);
  if (riesgo === 0) return null;
  return beneficio / riesgo;
};

const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

// ---------- component ----------

function TradingTracker() {
  const [account, setAccount] = useState({
    capitalInicial: 10000,
    currency: "EUR",
    riskPerTrade: 2,
    riskDaily: 5,
    riskWeekly: 10,
  });
  const [operations, setOperations] = useState([]);
  const [movements, setMovements] = useState([]);
  const [users, setUsers] = useState([]);
  const [currentUserId, setCurrentUserId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [storageOk, setStorageOk] = useState(true);

  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(EMPTY_FORM);
  const [editingId, setEditingId] = useState(null);
  const [filterUserId, setFilterUserId] = useState("__all__");
  const [editingCapital, setEditingCapital] = useState(false);
  const [capitalDraft, setCapitalDraft] = useState("10000");
  const [sortKey, setSortKey] = useState("fecha");
  const [sortDir, setSortDir] = useState("desc");
  const [expandedRow, setExpandedRow] = useState(null);

  const [showSettings, setShowSettings] = useState(false);
  const [settingsTab, setSettingsTab] = useState("cuenta");
  const [configDraft, setConfigDraft] = useState(account);
  const [showMovementForm, setShowMovementForm] = useState(false);
  const [movementForm, setMovementForm] = useState(EMPTY_MOVEMENT);
  const [userForm, setUserForm] = useState(EMPTY_USER);

  const [priceStatus, setPriceStatus] = useState({}); // { [opId or 'form']: 'loading'|'error'|'ok' }
  const [selectedTaxYear, setSelectedTaxYear] = useState(new Date().getFullYear());

  const currency = account.currency || "EUR";
  const money = (n) => fmtMoney(n, currency);

  // ---- load ----
  useEffect(() => {
    (async () => {
      try {
        const keys = ["account-config", "operations-list", "liquidity-movements", "users-list", "current-user-id"];
        const results = {};
        for (const k of keys) {
          try {
            const r = await window.storage.get(k, false);
            results[k] = r ? JSON.parse(r.value) : null;
          } catch (e) {
            results[k] = null;
          }
        }
        let loadedUsers = results["users-list"] || [];
        if (!loadedUsers.length) {
          const admin = { id: uid(), nombre: "Administrador", rol: "admin" };
          loadedUsers = [admin];
          try {
            await window.storage.set("users-list", JSON.stringify(loadedUsers), false);
          } catch (e) {}
        }
        setUsers(loadedUsers);

        let curUser = results["current-user-id"];
        if (!curUser || !loadedUsers.find((u) => u.id === curUser)) {
          curUser = loadedUsers.find((u) => u.rol === "admin")?.id || loadedUsers[0].id;
        }
        setCurrentUserId(curUser);

        if (results["account-config"]) {
          setAccount((prev) => ({ ...prev, ...results["account-config"] }));
          setCapitalDraft(String(results["account-config"].capitalInicial ?? 10000));
          setConfigDraft((prev) => ({ ...prev, ...results["account-config"] }));
        }
        if (results["operations-list"]) setOperations(results["operations-list"]);
        if (results["liquidity-movements"]) setMovements(results["liquidity-movements"]);
      } catch (e) {
        setStorageOk(false);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const persist = useCallback(async (key, value) => {
    try {
      await window.storage.set(key, JSON.stringify(value), false);
    } catch (e) {
      setStorageOk(false);
    }
  }, []);

  const currentUser = users.find((u) => u.id === currentUserId) || null;
  const isAdmin = currentUser?.rol === "admin";

  // ---- account / config ----
  const saveCapital = () => {
    const val = parseFloat(capitalDraft.replace(",", "."));
    const next = { ...account, capitalInicial: Number.isFinite(val) ? val : 0 };
    setAccount(next);
    persist("account-config", next);
    setEditingCapital(false);
  };

  const saveConfig = () => {
    const next = {
      ...account,
      currency: configDraft.currency,
      riskPerTrade: parseFloat(configDraft.riskPerTrade) || 0,
      riskDaily: parseFloat(configDraft.riskDaily) || 0,
      riskWeekly: parseFloat(configDraft.riskWeekly) || 0,
    };
    setAccount(next);
    persist("account-config", next);
  };

  // ---- precio en vivo (best-effort) ----
  // Intenta obtener el último precio desde Stooq (fuente gratuita, sin clave).
  // No siempre funciona (depende del ticker/mercado y de si el navegador
  // permite la petición). Si falla, se recomienda introducir el precio a mano.
  const fetchLivePrice = async (activo, targetKey, onSuccess) => {
    if (!activo) return;
    setPriceStatus((s) => ({ ...s, [targetKey]: "loading" }));
    try {
      const symbol = activo.trim().toLowerCase();
      const guess = symbol.includes(".") ? symbol : `${symbol}.us`;
      const res = await fetch(`https://stooq.com/q/l/?s=${encodeURIComponent(guess)}&f=sd2t2ohlc&h&e=csv`);
      if (!res.ok) throw new Error("network");
      const text = await res.text();
      const lines = text.trim().split("\n");
      if (lines.length < 2) throw new Error("empty");
      const cols = lines[1].split(",");
      const close = parseFloat(cols[6]);
      if (!Number.isFinite(close) || close <= 0) throw new Error("parse");
      onSuccess(close);
      setPriceStatus((s) => ({ ...s, [targetKey]: "ok" }));
    } catch (e) {
      setPriceStatus((s) => ({ ...s, [targetKey]: "error" }));
    }
  };

  // ---- operations crud ----
  const resetForm = () => {
    setForm({ ...EMPTY_FORM, usuarioId: currentUserId || "" });
    setEditingId(null);
  };

  const submitForm = (e) => {
    e.preventDefault();
    if (!form.activo || form.entrada === "" || form.cantidad === "") return;
    if (form.estado === "cerrada" && form.salida === "") return;
    const payload = form.estado === "abierta" ? { ...form, fecha: form.fechaEntrada } : form;
    let next;
    if (editingId) {
      next = operations.map((o) => (o.id === editingId ? { ...payload, id: editingId } : o));
    } else {
      next = [...operations, { ...payload, id: uid() }];
    }
    setOperations(next);
    persist("operations-list", next);
    resetForm();
    setShowForm(false);
  };

  const editOp = (op) => {
    setForm({ ...EMPTY_FORM, ...op, fechaEntrada: op.fechaEntrada || op.fecha || todayISO() });
    setEditingId(op.id);
    setShowForm(true);
  };

  const deleteOp = (id) => {
    const next = operations.filter((o) => o.id !== id);
    setOperations(next);
    persist("operations-list", next);
  };

  const updateOpLivePrice = (op) => {
    fetchLivePrice(op.activo, op.id, (precio) => {
      const next = operations.map((o) => (o.id === op.id ? { ...o, precioActual: String(precio) } : o));
      setOperations(next);
      persist("operations-list", next);
    });
  };

  // ---- movements crud ----
  const submitMovement = (e) => {
    e.preventDefault();
    const monto = parseFloat(String(movementForm.monto).replace(",", "."));
    if (!Number.isFinite(monto) || monto <= 0) return;
    const next = [...movements, { ...movementForm, monto, id: uid() }];
    setMovements(next);
    persist("liquidity-movements", next);
    setMovementForm(EMPTY_MOVEMENT);
    setShowMovementForm(false);
  };

  const deleteMovement = (id) => {
    const next = movements.filter((m) => m.id !== id);
    setMovements(next);
    persist("liquidity-movements", next);
  };

  // ---- users crud ----
  const addUser = (e) => {
    e.preventDefault();
    if (!userForm.nombre.trim()) return;
    const next = [...users, { id: uid(), nombre: userForm.nombre.trim(), rol: userForm.rol }];
    setUsers(next);
    persist("users-list", next);
    setUserForm(EMPTY_USER);
  };

  const changeUserRole = (id, rol) => {
    const admins = users.filter((u) => u.rol === "admin");
    if (rol === "estandar" && admins.length === 1 && admins[0].id === id) return; // keep at least one admin
    const next = users.map((u) => (u.id === id ? { ...u, rol } : u));
    setUsers(next);
    persist("users-list", next);
  };

  const deleteUser = (id) => {
    const admins = users.filter((u) => u.rol === "admin");
    const target = users.find((u) => u.id === id);
    if (target?.rol === "admin" && admins.length === 1) return; // don't delete last admin
    const next = users.filter((u) => u.id !== id);
    setUsers(next);
    persist("users-list", next);
    if (currentUserId === id) {
      const fallback = next.find((u) => u.rol === "admin") || next[0];
      setCurrentUserId(fallback?.id || null);
      persist("current-user-id", fallback?.id || null);
    }
  };

  const switchUser = (id) => {
    setCurrentUserId(id);
    persist("current-user-id", id);
  };

  // ---- derived: filtered ops ----
  const filteredOps = useMemo(() => {
    if (filterUserId === "__all__") return operations;
    return operations.filter((o) => o.usuarioId === filterUserId);
  }, [operations, filterUserId]);

  const opsWithPnl = useMemo(() => filteredOps.map((o) => ({ ...o, ...calcPnl(o) })), [filteredOps]);
  const allOpsWithPnl = useMemo(() => operations.map((o) => ({ ...o, ...calcPnl(o) })), [operations]);
  const closedOps = useMemo(() => opsWithPnl.filter((o) => o.estado !== "abierta"), [opsWithPnl]);
  const openOps = useMemo(() => opsWithPnl.filter((o) => o.estado === "abierta"), [opsWithPnl]);
  const allClosedOps = useMemo(() => allOpsWithPnl.filter((o) => o.estado !== "abierta"), [allOpsWithPnl]);
  const allOpenOps = useMemo(() => allOpsWithPnl.filter((o) => o.estado === "abierta"), [allOpsWithPnl]);

  const totalPnl = useMemo(() => allClosedOps.reduce((s, o) => s + o.neto, 0), [allClosedOps]);
  const totalMovements = useMemo(
    () => movements.reduce((s, m) => s + (m.tipo === "aporte" ? m.monto : -m.monto), 0),
    [movements]
  );
  const capitalTotal = account.capitalInicial + totalMovements + totalPnl;
  const invertidoActual = useMemo(
    () => allOpenOps.reduce((s, o) => s + (Number(o.entrada) || 0) * (Number(o.cantidad) || 0), 0),
    [allOpenOps]
  );
  const liquidezDisponible = capitalTotal - invertidoActual;
  const pctLiquidez = capitalTotal !== 0 ? (liquidezDisponible / capitalTotal) * 100 : 0;
  const pctInvertido = capitalTotal !== 0 ? (invertidoActual / capitalTotal) * 100 : 0;

  const periodStats = useMemo(() => {
    const now = new Date();
    const todayStr = todayISO();
    const weekStart = startOfWeek(now);
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const yearStart = new Date(now.getFullYear(), 0, 1);
    const sums = { dia: 0, semana: 0, mes: 0, anio: 0 };
    closedOps.forEach((o) => {
      if (!o.fecha) return;
      const d = new Date(o.fecha + "T00:00:00");
      if (o.fecha === todayStr) sums.dia += o.neto;
      if (d >= weekStart) sums.semana += o.neto;
      if (d >= monthStart) sums.mes += o.neto;
      if (d >= yearStart) sums.anio += o.neto;
    });
    return sums;
  }, [closedOps]);

  const generalStats = useMemo(() => {
    const n = closedOps.length;
    const ganadoras = closedOps.filter((o) => o.neto > 0);
    const perdedoras = closedOps.filter((o) => o.neto < 0);
    const gananciaTotal = closedOps.reduce((s, o) => s + o.neto, 0);
    const sumGanadoras = ganadoras.reduce((s, o) => s + o.neto, 0);
    const sumPerdedoras = Math.abs(perdedoras.reduce((s, o) => s + o.neto, 0));
    const winRate = n ? (ganadoras.length / n) * 100 : 0;
    const profitFactor = sumPerdedoras > 0 ? sumGanadoras / sumPerdedoras : ganadoras.length ? Infinity : 0;
    const avgWin = ganadoras.length ? sumGanadoras / ganadoras.length : 0;
    const avgLoss = perdedoras.length ? sumPerdedoras / perdedoras.length : 0;
    const mejor = n ? closedOps.reduce((a, b) => (b.neto > a.neto ? b : a)) : null;
    const peor = n ? closedOps.reduce((a, b) => (b.neto < a.neto ? b : a)) : null;
    const media = n ? gananciaTotal / n : 0;
    return { n, winRate, profitFactor, avgWin, avgLoss, mejor, peor, media, gananciaTotal };
  }, [closedOps]);

  // chronological combined timeline: liquidity movements + closed trades
  const timeline = useMemo(() => {
    const evs = [];
    (filterUserId === "__all__" ? movements : movements).forEach((m) => {
      evs.push({ fecha: m.fecha, hora: "00:00", delta: m.tipo === "aporte" ? m.monto : -m.monto, kind: "movimiento" });
    });
    (filterUserId === "__all__" ? allClosedOps : closedOps).forEach((o) => {
      evs.push({ fecha: o.fecha, hora: o.hora || "12:00", delta: o.neto, kind: "operacion", activo: o.activo });
    });
    evs.sort((a, b) => (a.fecha + a.hora > b.fecha + b.hora ? 1 : -1));
    return evs;
  }, [movements, allClosedOps, closedOps, filterUserId]);

  const equityCurve = useMemo(() => {
    let running = account.capitalInicial;
    const points = [{ fecha: "Inicio", balance: running }];
    timeline.forEach((e) => {
      running += e.delta;
      points.push({ fecha: fmtDate(e.fecha), balance: running });
    });
    return points;
  }, [timeline, account.capitalInicial]);

  const advancedStats = useMemo(() => {
    // max drawdown
    let peak = account.capitalInicial;
    let running = account.capitalInicial;
    let maxDD = 0;
    timeline.forEach((e) => {
      running += e.delta;
      if (running > peak) peak = running;
      const dd = peak > 0 ? ((peak - running) / peak) * 100 : 0;
      if (dd > maxDD) maxDD = dd;
    });

    // streaks (chronological, closed trades only)
    const sortedClosed = [...closedOps].sort((a, b) => (a.fecha + (a.hora || "") > b.fecha + (b.hora || "") ? 1 : -1));
    let curWin = 0,
      curLoss = 0,
      maxWin = 0,
      maxLoss = 0;
    sortedClosed.forEach((o) => {
      if (o.neto > 0) {
        curWin += 1;
        curLoss = 0;
      } else if (o.neto < 0) {
        curLoss += 1;
        curWin = 0;
      } else {
        curWin = 0;
        curLoss = 0;
      }
      if (curWin > maxWin) maxWin = curWin;
      if (curLoss > maxLoss) maxLoss = curLoss;
    });

    // expectancy in R (risk multiples), only trades with defined risk
    const withRisk = closedOps
      .map((o) => ({ ...o, riesgo: calcRiesgo(o) }))
      .filter((o) => o.riesgo && o.riesgo > 0);
    const expectancyR = withRisk.length
      ? withRisk.reduce((s, o) => s + o.neto / o.riesgo, 0) / withRisk.length
      : null;

    // by weekday
    const weekdayMap = {};
    closedOps.forEach((o) => {
      if (!o.fecha) return;
      const d = new Date(o.fecha + "T00:00:00");
      const idx = (d.getDay() + 6) % 7; // Monday = 0
      const label = WEEKDAYS[idx];
      weekdayMap[label] = (weekdayMap[label] || 0) + o.neto;
    });
    const byWeekday = WEEKDAYS.map((label) => ({ label, pnl: weekdayMap[label] || 0 })).filter(
      (w) => weekdayMap[w.label] !== undefined
    );

    // by hour
    const hourMap = {};
    let anyHour = false;
    closedOps.forEach((o) => {
      if (!o.hora) return;
      anyHour = true;
      const h = o.hora.split(":")[0] + ":00";
      hourMap[h] = (hourMap[h] || 0) + o.neto;
    });
    const byHour = Object.entries(hourMap)
      .map(([label, pnl]) => ({ label, pnl }))
      .sort((a, b) => (a.label > b.label ? 1 : -1));

    return { maxDD, maxWin, maxLoss, expectancyR, byWeekday, byHour, anyHour };
  }, [timeline, closedOps, account.capitalInicial]);

  // risk usage today / this week vs limits
  const riskUsage = useMemo(() => {
    const now = new Date();
    const todayStr = todayISO();
    const weekStart = startOfWeek(now);
    let dia = 0,
      semana = 0;
    operations.forEach((o) => {
      const riesgo = calcRiesgo(o);
      if (!riesgo || !o.fecha) return;
      const pctRiesgo = capitalTotal > 0 ? (riesgo / capitalTotal) * 100 : 0;
      if (o.fecha === todayStr) dia += pctRiesgo;
      const d = new Date(o.fecha + "T00:00:00");
      if (d >= weekStart) semana += pctRiesgo;
    });
    return { dia, semana };
  }, [operations, capitalTotal]);

  const bySymbol = useMemo(() => {
    const map = {};
    closedOps.forEach((o) => {
      if (!o.activo) return;
      map[o.activo] = (map[o.activo] || 0) + o.neto;
    });
    return Object.entries(map)
      .map(([activo, pnl]) => ({ activo, pnl }))
      .sort((a, b) => b.pnl - a.pnl);
  }, [closedOps]);

  // ---- fiscalidad: FIFO ya viene dado por el propio registro (cada operación
  // empareja su propia entrada/salida), regla de los 2 meses y arrastre de
  // pérdidas a 4 años, sobre las operaciones cerradas del usuario filtrado ----
  const taxData = useMemo(() => {
    const closed = closedOps.filter((o) => o.fecha);
    const withTaxInfo = closed.map((o) => {
      if (o.neto >= 0) return { ...o, computable: true, diferida: false };
      const repurchased = filteredOps.some(
        (other) => other.id !== o.id && other.activo === o.activo && other.fechaEntrada && isWithinTwoMonths(o.fecha, other.fechaEntrada)
      );
      return { ...o, computable: !repurchased, diferida: repurchased };
    });

    const years = {};
    withTaxInfo.forEach((o) => {
      const y = new Date(o.fecha + "T00:00:00").getFullYear();
      if (!years[y]) years[y] = { gains: 0, losses: 0, diferidas: 0, ops: [] };
      if (o.computable) {
        if (o.neto >= 0) years[y].gains += o.neto;
        else years[y].losses += Math.abs(o.neto);
      } else {
        years[y].diferidas += Math.abs(o.neto);
      }
      years[y].ops.push(o);
    });

    const allYears = Object.keys(years)
      .map(Number)
      .sort((a, b) => a - b);

    let carry = [];
    let selectedResult = null;
    allYears
      .filter((y) => y <= selectedTaxYear)
      .forEach((y) => {
        const yd = years[y];
        const rawNet = yd.gains - yd.losses;
        carry = carry.filter((c) => y - c.year <= 4);
        const carryBefore = carry.reduce((s, c) => s + c.amount, 0);
        let taxableBase = 0;
        let compensado = 0;
        if (rawNet < 0) {
          carry.push({ year: y, amount: -rawNet });
        } else if (rawNet > 0) {
          carry.sort((a, b) => a.year - b.year);
          let remaining = rawNet;
          for (const c of carry) {
            if (remaining <= 0) break;
            const use = Math.min(c.amount, remaining);
            c.amount -= use;
            remaining -= use;
            compensado += use;
          }
          carry = carry.filter((c) => c.amount > 0.001);
          taxableBase = remaining;
        }
        if (y === selectedTaxYear) {
          selectedResult = {
            year: y,
            gains: yd.gains,
            losses: yd.losses,
            diferidas: yd.diferidas,
            rawNet,
            carryBefore,
            compensado,
            taxableBase,
            ops: yd.ops,
            cuota: calcTax(taxableBase),
          };
        }
      });

    if (!selectedResult) {
      selectedResult = {
        year: selectedTaxYear,
        gains: 0,
        losses: 0,
        diferidas: 0,
        rawNet: 0,
        carryBefore: 0,
        compensado: 0,
        taxableBase: 0,
        ops: [],
        cuota: 0,
      };
    }

    return { ...selectedResult, pendingCarryAfter: carry, availableYears: allYears };
  }, [closedOps, filteredOps, selectedTaxYear]);

  const byUser = useMemo(() => {
    const map = {};
    allClosedOps.forEach((o) => {
      const u = users.find((u) => u.id === o.usuarioId);
      const key = u ? u.nombre : "Sin asignar";
      map[key] = (map[key] || 0) + o.neto;
    });
    return Object.entries(map)
      .map(([persona, pnl]) => ({ persona, pnl }))
      .sort((a, b) => b.pnl - a.pnl);
  }, [allClosedOps, users]);

  const sortedTable = useMemo(() => {
    const arr = [...opsWithPnl];
    arr.sort((a, b) => {
      let av = a[sortKey];
      let bv = b[sortKey];
      if (["neto", "pct", "entrada", "salida", "cantidad"].includes(sortKey)) {
        av = Number(av) || 0;
        bv = Number(bv) || 0;
      }
      if (av == null) av = "";
      if (bv == null) bv = "";
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return arr;
  }, [opsWithPnl, sortKey, sortDir]);

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else {
      setSortKey(key);
      setSortDir("desc");
    }
  };

  const ticker = useMemo(() => [...allClosedOps].sort((a, b) => (a.fecha > b.fecha ? 1 : -1)).slice(-40), [allClosedOps]);

  // live preview for the form
  const formPreview = useMemo(() => {
    const riesgo = calcRiesgo(form);
    const ratioRB = calcRatioRB(form);
    const tamano = (Number(form.entrada) || 0) * (Number(form.cantidad) || 0);
    const pctTamano = capitalTotal > 0 ? (tamano / capitalTotal) * 100 : 0;
    const pctRiesgo = riesgo && capitalTotal > 0 ? (riesgo / capitalTotal) * 100 : null;
    const pnl = form.estado === "cerrada" && form.entrada !== "" && form.salida !== "" && form.cantidad !== "" ? calcPnl(form) : null;
    return { riesgo, ratioRB, tamano, pctTamano, pctRiesgo, pnl };
  }, [form, capitalTotal]);

  // ---------- render ----------

  if (loading) {
    return (
      <div style={{ ...rootStyle, display: "flex", alignItems: "center", justifyContent: "center", minHeight: 400 }}>
        <div style={{ color: "var(--muted)", fontFamily: "var(--font-mono)" }}>Cargando diario de trading…</div>
      </div>
    );
  }

  return (
    <div style={rootStyle}>
      <GlobalStyle />

      {!storageOk && (
        <div style={warnBannerStyle}>
          No se ha podido conectar con el almacenamiento. Los cambios podrían no guardarse entre sesiones.
        </div>
      )}

      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 18 }}>
        <div>
          <div style={eyebrowStyle}>Diario de trading</div>
          <h1 style={{ fontFamily: "var(--font-display)", fontSize: 28, fontWeight: 700, margin: 0, color: "var(--text)" }}>
            Cartera
          </h1>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <UserSwitcher users={users} currentUserId={currentUserId} onSwitch={switchUser} />
          {isAdmin && (
            <button className="tt-btn tt-btn-ghost" onClick={() => setShowSettings((s) => !s)} title="Configuración">
              <SettingsIcon size={15} />
            </button>
          )}
        </div>
      </div>

      {/* Balance summary */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 10, marginBottom: 14 }}>
        <div style={{ ...cardStyle, padding: "16px 18px" }}>
          <div className="tt-label">Capital total</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 28, fontWeight: 600, color: totalPnl >= 0 ? "var(--gold)" : "var(--rose)" }}>
            {money(capitalTotal)}
          </div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--muted)" }}>
            {totalPnl >= 0 ? "+" : ""}
            {money(totalPnl)} en operaciones cerradas
          </div>
        </div>
        <div style={{ ...cardStyle, padding: "16px 18px" }}>
          <div className="tt-label">Liquidez vs invertido</div>
          <div style={{ display: "flex", height: 10, borderRadius: 5, overflow: "hidden", margin: "8px 0 6px" }}>
            <div style={{ width: `${pctLiquidez}%`, background: "var(--gold)" }} />
            <div style={{ width: `${pctInvertido}%`, background: "var(--rose)" }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "var(--font-mono)", fontSize: 12 }}>
            <span style={{ color: "var(--gold)" }}>{pctLiquidez.toFixed(1)}% liquidez</span>
            <span style={{ color: "var(--rose)" }}>{pctInvertido.toFixed(1)}% invertido</span>
          </div>
        </div>
        <div style={{ ...cardStyle, padding: "16px 18px" }}>
          <div className="tt-label">Capital inicial</div>
          {editingCapital ? (
            <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
              <input
                className="tt-input"
                style={{ width: 120, fontFamily: "var(--font-mono)" }}
                value={capitalDraft}
                onChange={(e) => setCapitalDraft(e.target.value)}
                autoFocus
                onKeyDown={(e) => e.key === "Enter" && saveCapital()}
              />
              <button className="tt-btn tt-btn-gold" onClick={saveCapital}>
                OK
              </button>
            </div>
          ) : (
            <div
              onClick={() => isAdmin && setEditingCapital(true)}
              style={{
                fontFamily: "var(--font-mono)",
                fontSize: 20,
                color: "var(--text)",
                cursor: isAdmin ? "pointer" : "default",
                borderBottom: isAdmin ? "1px dashed var(--muted)" : "none",
                display: "inline-block",
              }}
              title={isAdmin ? "Haz clic para editar" : ""}
            >
              {money(account.capitalInicial)}
            </div>
          )}
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--muted)", marginTop: 4 }}>
            {totalMovements >= 0 ? "+" : ""}
            {money(totalMovements)} en aportes/retiros
          </div>
        </div>
      </div>

      {/* Ticker tape */}
      <div className="tt-scrollbar" style={{ display: "flex", gap: 3, overflowX: "auto", paddingBottom: 8, marginBottom: 24, borderBottom: "1px solid var(--border)" }}>
        {ticker.length === 0 && (
          <div style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--muted)", padding: "6px 0" }}>
            Todavía no hay operaciones cerradas — la cinta se irá llenando con cada cierre.
          </div>
        )}
        {ticker.map((o) => (
          <div
            key={o.id}
            title={`${o.activo} · ${fmtDate(o.fecha)} · ${money(o.neto)}`}
            style={{
              flex: "0 0 auto",
              minWidth: 34,
              height: 34,
              borderRadius: 5,
              background: o.neto >= 0 ? "rgba(212,169,77,0.14)" : "rgba(225,89,90,0.14)",
              border: `1px solid ${o.neto >= 0 ? "rgba(212,169,77,0.4)" : "rgba(225,89,90,0.4)"}`,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              fontFamily: "var(--font-mono)",
              fontSize: 10,
              color: o.neto >= 0 ? "var(--gold)" : "var(--rose)",
              padding: "0 6px",
              whiteSpace: "nowrap",
            }}
          >
            {o.activo?.slice(0, 4) || "—"}
          </div>
        ))}
      </div>

      {/* Settings panel */}
      {showSettings && isAdmin && (
        <SettingsPanel
          configDraft={configDraft}
          setConfigDraft={setConfigDraft}
          saveConfig={saveConfig}
          users={users}
          userForm={userForm}
          setUserForm={setUserForm}
          addUser={addUser}
          changeUserRole={changeUserRole}
          deleteUser={deleteUser}
          currentUserId={currentUserId}
          movements={movements}
          showMovementForm={showMovementForm}
          setShowMovementForm={setShowMovementForm}
          movementForm={movementForm}
          setMovementForm={setMovementForm}
          submitMovement={submitMovement}
          deleteMovement={deleteMovement}
          settingsTab={settingsTab}
          setSettingsTab={setSettingsTab}
          onClose={() => setShowSettings(false)}
          money={money}
        />
      )}

      {/* Filter by user */}
      {users.length > 1 && (
        <div style={{ marginBottom: 18 }}>
          <div className="tt-label">Filtrar por usuario</div>
          <div style={{ position: "relative", display: "inline-block" }}>
            <select className="tt-input" style={{ paddingRight: 28, appearance: "none" }} value={filterUserId} onChange={(e) => setFilterUserId(e.target.value)}>
              <option value="__all__">Todos</option>
              {users.map((u) => (
                <option key={u.id} value={u.id}>
                  {u.nombre}
                </option>
              ))}
            </select>
            <ChevronDown size={14} style={{ position: "absolute", right: 8, top: 10, color: "var(--muted)", pointerEvents: "none" }} />
          </div>
        </div>
      )}

      {/* Period stats */}
      <SectionTitle>Rendimiento por periodo</SectionTitle>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginBottom: 20 }}>
        {[
          ["Hoy", periodStats.dia],
          ["Esta semana", periodStats.semana],
          ["Este mes", periodStats.mes],
          ["Este año", periodStats.anio],
        ].map(([label, val]) => (
          <StatCard key={label} label={label} value={money(val)} positive={val >= 0} icon={val >= 0 ? TrendingUp : TrendingDown} />
        ))}
      </div>

      {/* General stats */}
      <SectionTitle>Estadísticas generales</SectionTitle>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginBottom: 20 }}>
        <StatCard label="Ganancia total" value={money(generalStats.gananciaTotal)} positive={generalStats.gananciaTotal >= 0} plain />
        <StatCard label="Nº operaciones cerradas" value={String(generalStats.n)} plain neutral />
        <StatCard label="Operaciones abiertas" value={String(openOps.length)} plain neutral />
        <StatCard label="Win rate" value={`${generalStats.winRate.toFixed(1)}%`} plain neutral />
        <StatCard label="Profit factor" value={generalStats.profitFactor === Infinity ? "∞" : generalStats.profitFactor.toFixed(2)} plain neutral />
        <StatCard label="Ganancia media" value={money(generalStats.media)} positive={generalStats.media >= 0} plain />
        <StatCard label="Ganancia media (ganadoras)" value={money(generalStats.avgWin)} plain positive />
        <StatCard label="Pérdida media (perdedoras)" value={money(-generalStats.avgLoss)} plain positive={false} />
        <StatCard label="Mejor operación" value={generalStats.mejor ? money(generalStats.mejor.neto) : "—"} sub={generalStats.mejor?.activo} plain positive />
        <StatCard label="Peor operación" value={generalStats.peor ? money(generalStats.peor.neto) : "—"} sub={generalStats.peor?.activo} plain positive={false} />
      </div>

      {/* Advanced stats */}
      <SectionTitle>Estadísticas avanzadas</SectionTitle>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginBottom: 12 }}>
        <StatCard label="Drawdown máximo" value={`-${advancedStats.maxDD.toFixed(1)}%`} plain positive={false} />
        <StatCard label="Racha máx. victorias" value={String(advancedStats.maxWin)} plain positive />
        <StatCard label="Racha máx. derrotas" value={String(advancedStats.maxLoss)} plain positive={false} />
        <StatCard
          label="Expectativa (en R)"
          value={advancedStats.expectancyR == null ? "Sin datos de riesgo" : `${advancedStats.expectancyR >= 0 ? "+" : ""}${advancedStats.expectancyR.toFixed(2)}R`}
          plain
          positive={advancedStats.expectancyR == null ? undefined : advancedStats.expectancyR >= 0}
          neutral={advancedStats.expectancyR == null}
        />
      </div>

      {/* Risk usage vs limits */}
      <div style={{ ...cardStyle, padding: 16, marginBottom: 28 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <ShieldAlert size={15} color="var(--muted)" />
          <div style={{ fontFamily: "var(--font-display)", fontSize: 14, fontWeight: 600 }}>Uso del riesgo vs límites configurados</div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 16 }}>
          <RiskBar label="Riesgo arriesgado hoy" used={riskUsage.dia} limit={account.riskPerTrade > 0 ? account.riskDaily : 0} />
          <RiskBar label="Riesgo arriesgado esta semana" used={riskUsage.semana} limit={account.riskWeekly} />
        </div>
        <div style={{ fontFamily: "var(--font-body)", fontSize: 11, color: "var(--muted)", marginTop: 10 }}>
          Calculado sobre operaciones con stop loss definido. Límites configurables en Ajustes → Cuenta.
        </div>
      </div>

      {/* Equity curve */}
      <div style={{ ...cardStyle, marginBottom: 28, padding: "20px 12px 8px 0" }}>
        <div style={{ padding: "0 20px", marginBottom: 6 }}>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 16, fontWeight: 600 }}>Curva de capital</div>
          <div style={{ fontFamily: "var(--font-body)", fontSize: 11, color: "var(--muted)" }}>Incluye operaciones cerradas y aportes/retiros</div>
        </div>
        <div style={{ width: "100%" }}>
          <EquityChart data={equityCurve} baseline={account.capitalInicial} money={money} />
        </div>
      </div>

      {/* Breakdowns */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
        <BreakdownCard title="Por activo" rows={bySymbol} labelKey="activo" money={money} />
        <BreakdownCard title="Por usuario" rows={byUser} labelKey="persona" money={money} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: advancedStats.anyHour ? "1fr 1fr" : "1fr", gap: 16, marginBottom: 28 }}>
        <BreakdownCard title="Por día de la semana" rows={advancedStats.byWeekday} labelKey="label" money={money} />
        {advancedStats.anyHour && <BreakdownCard title="Por hora del día" rows={advancedStats.byHour} labelKey="label" money={money} />}
      </div>

      {/* Fiscalidad */}
      <SectionTitle>Fiscalidad (IRPF España / Canarias) · estimación</SectionTitle>
      <div style={{ ...cardStyle, padding: 20, marginBottom: 28 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <FileText size={16} color="var(--muted)" />
            <span style={{ fontFamily: "var(--font-body)", fontSize: 13, color: "var(--muted)" }}>
              Cálculo por {filterUserId === "__all__" ? "todos los usuarios (agrupado)" : users.find((u) => u.id === filterUserId)?.nombre} · la declaración de IRPF es individual, así que si hay varias personas conviene filtrar por usuario.
            </span>
          </div>
          <div>
            <select className="tt-input" style={{ width: "auto" }} value={selectedTaxYear} onChange={(e) => setSelectedTaxYear(Number(e.target.value))}>
              {(taxData.availableYears.length ? taxData.availableYears : [new Date().getFullYear()]).map((y) => (
                <option key={y} value={y}>
                  {y}
                </option>
              ))}
              {!taxData.availableYears.includes(new Date().getFullYear()) && <option value={new Date().getFullYear()}>{new Date().getFullYear()}</option>}
            </select>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 10, marginBottom: 14 }}>
          <StatCard label="Ganancias del año" value={money(taxData.gains)} plain positive />
          <StatCard label="Pérdidas computables" value={money(-taxData.losses)} plain positive={false} />
          <StatCard label="Pérdidas diferidas (regla 2 meses)" value={money(-taxData.diferidas)} plain neutral />
          <StatCard label="Saldo neto del ejercicio" value={money(taxData.rawNet)} positive={taxData.rawNet >= 0} plain />
          <StatCard label="Compensado con pérdidas de otros años" value={money(-taxData.compensado)} plain neutral />
          <StatCard label="Base imponible del ahorro" value={money(taxData.taxableBase)} positive plain />
          <StatCard label="Cuota estimada a pagar" value={money(taxData.cuota)} plain positive={false} />
        </div>

        {taxData.pendingCarryAfter.length > 0 && (
          <div style={{ marginBottom: 14 }}>
            <div className="tt-label">Pérdidas pendientes de compensar (arrastre a 4 años)</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              {taxData.pendingCarryAfter.map((c) => (
                <div key={c.year} style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--rose)" }}>
                  {money(c.amount)} generadas en {c.year} · caducan si no se compensan antes de {c.year + 4}
                </div>
              ))}
            </div>
          </div>
        )}

        {taxData.diferidas > 0 && (
          <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: "rgba(212,169,77,0.1)", border: "1px solid rgba(212,169,77,0.3)", borderRadius: 8, padding: 10, marginBottom: 14 }}>
            <AlertTriangle size={14} color="var(--gold)" style={{ marginTop: 2, flexShrink: 0 }} />
            <div style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--text)" }}>
              Hay {money(taxData.diferidas)} en pérdidas afectadas por la regla de los 2 meses (recompra del mismo activo dentro de los 2 meses
              anteriores o posteriores a la venta). No se pueden deducir este año; quedan "aparcadas" hasta que vendas definitivamente esas acciones
              sin recompra en la ventana. Este tracker las señala pero no reintegra el importe automáticamente en años futuros — llévalo aparte o consúltalo con tu asesor.
            </div>
          </div>
        )}

        <div>
          <div className="tt-label">Documentación por operación ({taxData.year})</div>
          {taxData.ops.length === 0 ? (
            <div style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--muted)" }}>Sin operaciones cerradas en este año.</div>
          ) : (
            <div className="tt-scrollbar" style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 700 }}>
                <thead>
                  <tr>
                    {["Activo", "F. compra", "F. venta", "Valor adquisición", "Valor transmisión", "Resultado", "Regla 2 meses"].map((h) => (
                      <th key={h} style={{ ...thBaseStyle, padding: "6px 10px" }}>
                        {h}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {taxData.ops.map((o) => (
                    <tr key={o.id} style={{ borderBottom: "1px solid var(--border)" }}>
                      <td style={{ ...tdStyle, padding: "6px 10px", fontFamily: "var(--font-mono)" }}>{o.activo}</td>
                      <td style={{ ...tdStyle, padding: "6px 10px" }}>{fmtDate(o.fechaEntrada || o.fecha)}</td>
                      <td style={{ ...tdStyle, padding: "6px 10px" }}>{fmtDate(o.fecha)}</td>
                      <td style={{ ...tdStyle, padding: "6px 10px", fontFamily: "var(--font-mono)" }}>{money((Number(o.entrada) || 0) * (Number(o.cantidad) || 0))}</td>
                      <td style={{ ...tdStyle, padding: "6px 10px", fontFamily: "var(--font-mono)" }}>{money((Number(o.salida) || 0) * (Number(o.cantidad) || 0))}</td>
                      <td style={{ ...tdStyle, padding: "6px 10px", fontFamily: "var(--font-mono)", color: o.neto >= 0 ? "var(--gold)" : "var(--rose)" }}>{money(o.neto)}</td>
                      <td style={{ ...tdStyle, padding: "6px 10px" }}>
                        {o.diferida ? (
                          <Badge color="var(--gold)" bg="rgba(212,169,77,0.15)">Diferida</Badge>
                        ) : (
                          <span style={{ color: "var(--muted)", fontSize: 12 }}>—</span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>

        <div style={{ fontFamily: "var(--font-body)", fontSize: 11, color: "var(--muted)", marginTop: 14, lineHeight: 1.5 }}>
          Esto es una estimación educativa, no asesoramiento fiscal. Usa la escala estatal del ahorro vigente para el ejercicio 2025 (declaración
          2026): 19% hasta 6.000€, 21% hasta 50.000€, 23% hasta 200.000€, 27% hasta 300.000€ y 30% en adelante. Esta escala es única para toda
          España — en Canarias tributa igual que en el resto del país para plusvalías de bolsa (donde sí hay diferencias es en otros impuestos como
          el IGIC, que no afecta a esta actividad). Asume que los activos cotizan en mercados regulados (regla de los 2 meses); si operas valores no
          cotizados el plazo legal es de 1 año, no 2 meses. No calcula la compensación cruzada del 25% con dividendos/intereses ni dividendos en sí.
          Verifica siempre con un asesor fiscal antes de presentar la declaración.
        </div>
      </div>

      {/* Add operation */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ fontFamily: "var(--font-display)", fontSize: 18, fontWeight: 600 }}>
          Operaciones {filterUserId !== "__all__" ? `· ${users.find((u) => u.id === filterUserId)?.nombre}` : ""}
        </div>
        <button
          className="tt-btn tt-btn-gold"
          onClick={() => {
            resetForm();
            setShowForm((s) => !s);
          }}
        >
          {showForm ? <X size={15} /> : <Plus size={15} />}
          {showForm ? "Cancelar" : "Nueva operación"}
        </button>
      </div>

      {showForm && (
        <form onSubmit={submitForm} style={{ ...cardStyle, padding: 20, marginBottom: 20 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 12, marginBottom: 12 }}>
            <div>
              <label className="tt-label">Fecha de compra</label>
              <input className="tt-input" type="date" value={form.fechaEntrada} onChange={(e) => setForm({ ...form, fechaEntrada: e.target.value })} required />
            </div>
            {form.estado === "cerrada" && (
              <div>
                <label className="tt-label">Fecha de venta</label>
                <input className="tt-input" type="date" value={form.fecha} onChange={(e) => setForm({ ...form, fecha: e.target.value })} required />
              </div>
            )}
            <div>
              <label className="tt-label">Hora de cierre (opcional)</label>
              <input className="tt-input" type="time" value={form.hora} onChange={(e) => setForm({ ...form, hora: e.target.value })} />
            </div>
            <div>
              <label className="tt-label">Activo</label>
              <input className="tt-input" placeholder="AAPL, BTC…" value={form.activo} onChange={(e) => setForm({ ...form, activo: e.target.value })} required />
            </div>
            <div>
              <label className="tt-label">Usuario</label>
              <select className="tt-input" value={form.usuarioId} onChange={(e) => setForm({ ...form, usuarioId: e.target.value })}>
                <option value="">Sin asignar</option>
                {users.map((u) => (
                  <option key={u.id} value={u.id}>
                    {u.nombre}
                  </option>
                ))}
              </select>
            </div>
            <div>
              <label className="tt-label">Dirección</label>
              <select className="tt-input" value={form.direccion} onChange={(e) => setForm({ ...form, direccion: e.target.value })}>
                <option value="larga">Larga (compra)</option>
                <option value="corta">Corta (venta)</option>
              </select>
            </div>
            <div>
              <label className="tt-label">Estado</label>
              <select className="tt-input" value={form.estado} onChange={(e) => setForm({ ...form, estado: e.target.value })}>
                <option value="cerrada">Cerrada</option>
                <option value="abierta">Abierta</option>
              </select>
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 12, marginBottom: 12 }}>
            <div>
              <label className="tt-label">Precio entrada</label>
              <input className="tt-input" type="number" step="any" value={form.entrada} onChange={(e) => setForm({ ...form, entrada: e.target.value })} required />
            </div>
            {form.estado === "cerrada" ? (
              <div>
                <label className="tt-label">Precio salida</label>
                <input className="tt-input" type="number" step="any" value={form.salida} onChange={(e) => setForm({ ...form, salida: e.target.value })} required />
              </div>
            ) : (
              <div>
                <label className="tt-label">Precio actual (opcional)</label>
                <div style={{ display: "flex", gap: 6 }}>
                  <input className="tt-input" type="number" step="any" value={form.precioActual} onChange={(e) => setForm({ ...form, precioActual: e.target.value })} />
                  <button
                    type="button"
                    className="tt-btn tt-btn-ghost"
                    style={{ padding: "8px 10px" }}
                    disabled={!form.activo || priceStatus.form === "loading"}
                    onClick={() => fetchLivePrice(form.activo, "form", (p) => setForm((f) => ({ ...f, precioActual: String(p) })))}
                    title="Intentar obtener el precio en vivo (beta)"
                  >
                    {priceStatus.form === "loading" ? "…" : "Actualizar"}
                  </button>
                </div>
                {priceStatus.form === "error" && (
                  <div style={{ fontFamily: "var(--font-body)", fontSize: 11, color: "var(--rose)", marginTop: 4 }}>
                    No se pudo obtener el precio automáticamente para "{form.activo}". Introdúcelo manualmente.
                  </div>
                )}
              </div>
            )}
            <div>
              <label className="tt-label">Cantidad</label>
              <input className="tt-input" type="number" step="any" value={form.cantidad} onChange={(e) => setForm({ ...form, cantidad: e.target.value })} required />
            </div>
            <div>
              <label className="tt-label">Comisión (opcional)</label>
              <input className="tt-input" type="number" step="any" value={form.comision} onChange={(e) => setForm({ ...form, comision: e.target.value })} />
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 12, marginBottom: 12 }}>
            <div>
              <label className="tt-label">Stop loss (opcional)</label>
              <input className="tt-input" type="number" step="any" value={form.stopLoss} onChange={(e) => setForm({ ...form, stopLoss: e.target.value })} />
            </div>
            <div>
              <label className="tt-label">Take profit (opcional)</label>
              <input className="tt-input" type="number" step="any" value={form.takeProfit} onChange={(e) => setForm({ ...form, takeProfit: e.target.value })} />
            </div>
          </div>

          <div style={{ marginBottom: 14 }}>
            <label className="tt-label">Notas (opcional)</label>
            <input className="tt-input" value={form.notas} onChange={(e) => setForm({ ...form, notas: e.target.value })} placeholder="Estrategia, motivo de entrada/salida…" />
          </div>

          {/* live preview */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 16, marginBottom: 14, fontFamily: "var(--font-mono)", fontSize: 12 }}>
            {formPreview.pnl && (
              <span style={{ color: formPreview.pnl.neto >= 0 ? "var(--gold)" : "var(--rose)" }}>
                Resultado estimado: {money(formPreview.pnl.neto)} ({fmtPct(formPreview.pnl.pct)})
              </span>
            )}
            {formPreview.tamano > 0 && (
              <span style={{ color: "var(--text)" }}>
                Tamaño posición: {money(formPreview.tamano)} ({formPreview.pctTamano.toFixed(1)}% del capital)
              </span>
            )}
            {formPreview.riesgo != null && (
              <span style={{ color: account.riskPerTrade && formPreview.pctRiesgo > account.riskPerTrade ? "var(--rose)" : "var(--muted)" }}>
                Riesgo: {money(formPreview.riesgo)} ({formPreview.pctRiesgo?.toFixed(1)}% del capital)
                {account.riskPerTrade > 0 && formPreview.pctRiesgo > account.riskPerTrade ? " · supera tu límite por operación" : ""}
              </span>
            )}
            {formPreview.ratioRB != null && <span style={{ color: "var(--muted)" }}>Ratio R/B planeado: 1:{formPreview.ratioRB.toFixed(2)}</span>}
          </div>

          <button className="tt-btn tt-btn-gold" type="submit">
            {editingId ? "Guardar cambios" : "Registrar operación"}
          </button>
        </form>
      )}

      {/* Table */}
      <div style={{ ...cardStyle, overflowX: "auto" }} className="tt-scrollbar">
        {sortedTable.length === 0 ? (
          <div style={{ padding: 32, textAlign: "center", fontFamily: "var(--font-body)", color: "var(--muted)", fontSize: 13 }}>
            Aún no hay operaciones. Registra la primera para empezar a ver tus estadísticas.
          </div>
        ) : (
          <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 820 }}>
            <thead>
              <tr>
                <th style={thBaseStyle}></th>
                {[
                  ["fecha", "Fecha"],
                  ["activo", "Activo"],
                  ["direccion", "Dir."],
                  ["estado", "Estado"],
                  ["entrada", "Entrada"],
                  ["salida", "Salida"],
                  ["cantidad", "Cant."],
                  ["neto", "P/L"],
                  ["pct", "P/L %"],
                ].map(([key, label]) => (
                  <th key={key} className="tt-th" onClick={() => toggleSort(key)} style={{ ...thBaseStyle, color: sortKey === key ? "var(--text)" : "var(--muted)" }}>
                    {label} {sortKey === key ? (sortDir === "asc" ? "↑" : "↓") : ""}
                  </th>
                ))}
                <th style={thBaseStyle}></th>
              </tr>
            </thead>
            <tbody>
              {sortedTable.map((o) => {
                const unrealized = calcUnrealized(o);
                const isOpen = o.estado === "abierta";
                const displayNeto = isOpen ? unrealized?.neto : o.neto;
                const displayPct = isOpen ? unrealized?.pct : o.pct;
                const u = users.find((u) => u.id === o.usuarioId);
                return (
                  <React.Fragment key={o.id}>
                    <tr className="tt-row" style={{ borderBottom: expandedRow === o.id ? "none" : "1px solid var(--border)", cursor: "pointer" }} onClick={() => setExpandedRow(expandedRow === o.id ? null : o.id)}>
                      <td style={{ ...tdStyle, width: 26 }}>{expandedRow === o.id ? <ChevronDown size={14} color="var(--muted)" /> : <ChevronRight size={14} color="var(--muted)" />}</td>
                      <td style={tdStyle}>{fmtDate(o.fecha)}</td>
                      <td style={{ ...tdStyle, fontFamily: "var(--font-mono)" }}>{o.activo}</td>
                      <td style={tdStyle}>
                        <Badge color={o.direccion === "corta" ? "var(--rose)" : "var(--text)"} bg={o.direccion === "corta" ? "rgba(225,89,90,0.15)" : "rgba(124,138,160,0.15)"}>
                          {o.direccion === "corta" ? "CORTA" : "LARGA"}
                        </Badge>
                      </td>
                      <td style={tdStyle}>
                        <Badge color={isOpen ? "var(--gold)" : "var(--muted)"} bg={isOpen ? "rgba(212,169,77,0.15)" : "rgba(124,138,160,0.1)"}>
                          {isOpen ? "ABIERTA" : "CERRADA"}
                        </Badge>
                      </td>
                      <td style={{ ...tdStyle, fontFamily: "var(--font-mono)" }}>{Number(o.entrada).toFixed(2)}</td>
                      <td style={{ ...tdStyle, fontFamily: "var(--font-mono)" }}>{isOpen ? "—" : Number(o.salida).toFixed(2)}</td>
                      <td style={{ ...tdStyle, fontFamily: "var(--font-mono)" }}>{o.cantidad}</td>
                      <td style={{ ...tdStyle, fontFamily: "var(--font-mono)", fontWeight: 600, color: displayNeto == null ? "var(--muted)" : displayNeto >= 0 ? "var(--gold)" : "var(--rose)" }}>
                        {displayNeto == null ? "—" : money(displayNeto)}
                        {isOpen && displayNeto != null && <span style={{ fontSize: 10, color: "var(--muted)" }}> (no real.)</span>}
                      </td>
                      <td style={{ ...tdStyle, fontFamily: "var(--font-mono)", color: displayPct == null ? "var(--muted)" : displayPct >= 0 ? "var(--gold)" : "var(--rose)" }}>
                        {displayPct == null ? "—" : fmtPct(displayPct)}
                      </td>
                      <td style={{ ...tdStyle, whiteSpace: "nowrap" }} onClick={(e) => e.stopPropagation()}>
                        {isOpen && (
                          <button
                            onClick={() => updateOpLivePrice(o)}
                            style={iconBtnStyle}
                            title="Actualizar precio en vivo (beta)"
                            disabled={priceStatus[o.id] === "loading"}
                          >
                            <RefreshCw size={14} className={priceStatus[o.id] === "loading" ? "tt-spin" : ""} />
                          </button>
                        )}
                        <button onClick={() => editOp(o)} style={{ ...iconBtnStyle, marginLeft: isOpen ? 4 : 0 }} title="Editar">
                          <Pencil size={14} />
                        </button>
                        <button onClick={() => deleteOp(o.id)} style={{ ...iconBtnStyle, marginLeft: 4 }} title="Eliminar">
                          <Trash2 size={14} />
                        </button>
                        {priceStatus[o.id] === "error" && (
                          <div style={{ fontSize: 10, color: "var(--rose)", marginTop: 3 }}>Sin precio</div>
                        )}
                      </td>
                    </tr>
                    {expandedRow === o.id && (
                      <tr style={{ borderBottom: "1px solid var(--border)" }}>
                        <td colSpan={11} style={{ background: "var(--surface-2)", padding: "12px 16px" }}>
                          <div style={{ display: "flex", flexWrap: "wrap", gap: 20, fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--text)" }}>
                            <span>Usuario: <b style={{ color: "var(--text)" }}>{u?.nombre || "Sin asignar"}</b></span>
                            {o.fechaEntrada && <span>Fecha compra: {fmtDate(o.fechaEntrada)}</span>}
                            {o.hora && <span>Hora: {o.hora}</span>}
                            {o.stopLoss && <span>Stop loss: {Number(o.stopLoss).toFixed(2)}</span>}
                            {o.takeProfit && <span>Take profit: {Number(o.takeProfit).toFixed(2)}</span>}
                            {calcRiesgo(o) != null && <span>Riesgo: {money(calcRiesgo(o))}</span>}
                            {calcRatioRB(o) != null && <span>Ratio R/B planeado: 1:{calcRatioRB(o).toFixed(2)}</span>}
                            {o.comision && <span>Comisión: {money(Number(o.comision))}</span>}
                          </div>
                          {o.notas && <div style={{ marginTop: 8, fontFamily: "var(--font-body)", fontSize: 13, color: "var(--muted)" }}>{o.notas}</div>}
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      <div style={{ textAlign: "center", marginTop: 24, fontFamily: "var(--font-body)", fontSize: 11, color: "var(--muted)" }}>
        Los datos se guardan automáticamente en tu almacenamiento personal.
      </div>
    </div>
  );
}

// ---------- subcomponents ----------

function SectionTitle({ children }) {
  return <div style={{ fontFamily: "var(--font-body)", fontSize: 12, letterSpacing: ".06em", textTransform: "uppercase", color: "var(--muted)", marginBottom: 10 }}>{children}</div>;
}

function StatCard({ label, value, sub, positive, plain, neutral, icon: Icon }) {
  const color = neutral ? "var(--text)" : positive ? "var(--gold)" : "var(--rose)";
  return (
    <div style={{ ...cardStyle, padding: "14px 16px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div className="tt-label" style={{ marginBottom: 6 }}>
          {label}
        </div>
        {Icon && !plain && <Icon size={13} color={color} />}
      </div>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: 19, fontWeight: 600, color }}>{value}</div>
      {sub && <div style={{ fontFamily: "var(--font-body)", fontSize: 11, color: "var(--muted)", marginTop: 2 }}>{sub}</div>}
    </div>
  );
}

function BreakdownCard({ title, rows, labelKey, money }) {
  const max = Math.max(1, ...rows.map((r) => Math.abs(r.pnl)));
  return (
    <div style={{ ...cardStyle, padding: 18 }}>
      <div style={{ fontFamily: "var(--font-display)", fontSize: 15, fontWeight: 600, marginBottom: 12 }}>{title}</div>
      {rows.length === 0 && <div style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--muted)" }}>Sin datos todavía.</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {rows.slice(0, 8).map((r) => (
          <div key={r[labelKey]} style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 90, fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--text)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {r[labelKey]}
            </div>
            <div style={{ flex: 1, height: 6, background: "var(--surface-2)", borderRadius: 4, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${(Math.abs(r.pnl) / max) * 100}%`, background: r.pnl >= 0 ? "var(--gold)" : "var(--rose)", borderRadius: 4 }} />
            </div>
            <div style={{ width: 90, textAlign: "right", fontFamily: "var(--font-mono)", fontSize: 12, color: r.pnl >= 0 ? "var(--gold)" : "var(--rose)" }}>{money(r.pnl)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function RiskBar({ label, used, limit }) {
  const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
  const over = limit > 0 && used > limit;
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "var(--font-body)", fontSize: 12, color: "var(--muted)", marginBottom: 4 }}>
        <span>{label}</span>
        <span style={{ fontFamily: "var(--font-mono)", color: over ? "var(--rose)" : "var(--text)" }}>
          {used.toFixed(1)}% {limit > 0 ? `/ ${limit}%` : "(sin límite)"}
        </span>
      </div>
      <div style={{ height: 6, background: "var(--surface-2)", borderRadius: 4, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: over ? "var(--rose)" : "var(--gold)", borderRadius: 4 }} />
      </div>
    </div>
  );
}

function UserSwitcher({ users, currentUserId, onSwitch }) {
  const current = users.find((u) => u.id === currentUserId);
  return (
    <div style={{ position: "relative", display: "inline-flex", alignItems: "center", gap: 6 }}>
      <UserCircle size={16} color="var(--muted)" />
      <select
        className="tt-input"
        style={{ paddingRight: 26, appearance: "none", fontFamily: "var(--font-body)", width: "auto", minWidth: 130 }}
        value={currentUserId || ""}
        onChange={(e) => onSwitch(e.target.value)}
      >
        {users.map((u) => (
          <option key={u.id} value={u.id}>
            {u.nombre} {u.rol === "admin" ? "· admin" : ""}
          </option>
        ))}
      </select>
    </div>
  );
}

function Badge({ children, color, bg }) {
  return (
    <span style={{ fontSize: 10, padding: "2px 7px", borderRadius: 4, fontFamily: "var(--font-body)", background: bg, color }}>{children}</span>
  );
}

function SettingsPanel({
  configDraft,
  setConfigDraft,
  saveConfig,
  users,
  userForm,
  setUserForm,
  addUser,
  changeUserRole,
  deleteUser,
  currentUserId,
  movements,
  showMovementForm,
  setShowMovementForm,
  movementForm,
  setMovementForm,
  submitMovement,
  deleteMovement,
  settingsTab,
  setSettingsTab,
  onClose,
  money,
}) {
  return (
    <div style={{ ...cardStyle, padding: 20, marginBottom: 24 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div style={{ fontFamily: "var(--font-display)", fontSize: 18, fontWeight: 600 }}>Ajustes</div>
        <button className="tt-btn tt-btn-ghost" onClick={onClose}>
          <X size={14} />
        </button>
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 18, borderBottom: "1px solid var(--border)" }}>
        {[
          ["cuenta", "Cuenta"],
          ["usuarios", "Usuarios"],
          ["liquidez", "Movimientos de liquidez"],
        ].map(([key, label]) => (
          <button
            key={key}
            onClick={() => setSettingsTab(key)}
            style={{
              background: "none",
              border: "none",
              cursor: "pointer",
              padding: "8px 4px 10px",
              fontFamily: "var(--font-body)",
              fontSize: 13,
              fontWeight: 600,
              color: settingsTab === key ? "var(--gold)" : "var(--muted)",
              borderBottom: settingsTab === key ? "2px solid var(--gold)" : "2px solid transparent",
              marginRight: 12,
            }}
          >
            {label}
          </button>
        ))}
      </div>

      {settingsTab === "cuenta" && (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 14, marginBottom: 14 }}>
            <div>
              <label className="tt-label">Moneda</label>
              <select className="tt-input" value={configDraft.currency} onChange={(e) => setConfigDraft({ ...configDraft, currency: e.target.value })}>
                {Object.keys(CURRENCIES).map((c) => (
                  <option key={c} value={c}>
                    {c}
                  </option>
                ))}
              </select>
            </div>
            <div>
              <label className="tt-label">Límite riesgo por operación (%)</label>
              <input className="tt-input" type="number" step="any" value={configDraft.riskPerTrade} onChange={(e) => setConfigDraft({ ...configDraft, riskPerTrade: e.target.value })} />
            </div>
            <div>
              <label className="tt-label">Límite riesgo diario (%)</label>
              <input className="tt-input" type="number" step="any" value={configDraft.riskDaily} onChange={(e) => setConfigDraft({ ...configDraft, riskDaily: e.target.value })} />
            </div>
            <div>
              <label className="tt-label">Límite riesgo semanal (%)</label>
              <input className="tt-input" type="number" step="any" value={configDraft.riskWeekly} onChange={(e) => setConfigDraft({ ...configDraft, riskWeekly: e.target.value })} />
            </div>
          </div>
          <button className="tt-btn tt-btn-gold" onClick={saveConfig}>
            Guardar ajustes
          </button>
          <div style={{ fontFamily: "var(--font-body)", fontSize: 11, color: "var(--muted)", marginTop: 12 }}>
            Nota: el acceso a Ajustes se limita al usuario marcado como administrador dentro de la app, pero no hay contraseña real —
            cualquiera con acceso a la app puede cambiar de usuario. Úsalo para organizar roles, no como seguridad.
          </div>
        </div>
      )}

      {settingsTab === "usuarios" && (
        <div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
            {users.map((u) => (
              <div key={u.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: "var(--surface-2)", borderRadius: 7 }}>
                <span style={{ fontFamily: "var(--font-body)", fontSize: 13, flex: 1 }}>
                  {u.nombre} {u.id === currentUserId && <span style={{ color: "var(--muted)", fontSize: 11 }}>(activo)</span>}
                </span>
                <select className="tt-input" style={{ width: 130 }} value={u.rol} onChange={(e) => changeUserRole(u.id, e.target.value)}>
                  <option value="admin">Administrador</option>
                  <option value="estandar">Estándar</option>
                </select>
                <button onClick={() => deleteUser(u.id)} style={iconBtnStyle} title="Eliminar usuario">
                  <Trash2 size={14} />
                </button>
              </div>
            ))}
          </div>
          <form onSubmit={addUser} style={{ display: "flex", gap: 8 }}>
            <input className="tt-input" placeholder="Nombre del nuevo usuario" value={userForm.nombre} onChange={(e) => setUserForm({ ...userForm, nombre: e.target.value })} />
            <select className="tt-input" style={{ width: 130 }} value={userForm.rol} onChange={(e) => setUserForm({ ...userForm, rol: e.target.value })}>
              <option value="estandar">Estándar</option>
              <option value="admin">Administrador</option>
            </select>
            <button className="tt-btn tt-btn-gold" type="submit">
              Añadir
            </button>
          </form>
        </div>
      )}

      {settingsTab === "liquidez" && (
        <div>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}>
            <button className="tt-btn tt-btn-ghost" onClick={() => setShowMovementForm((s) => !s)}>
              {showMovementForm ? <X size={14} /> : <Plus size={14} />}
              {showMovementForm ? "Cancelar" : "Nuevo movimiento"}
            </button>
          </div>
          {showMovementForm && (
            <form onSubmit={submitMovement} style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 10, marginBottom: 16 }}>
              <div>
                <label className="tt-label">Fecha</label>
                <input className="tt-input" type="date" value={movementForm.fecha} onChange={(e) => setMovementForm({ ...movementForm, fecha: e.target.value })} />
              </div>
              <div>
                <label className="tt-label">Tipo</label>
                <select className="tt-input" value={movementForm.tipo} onChange={(e) => setMovementForm({ ...movementForm, tipo: e.target.value })}>
                  <option value="aporte">Aporte</option>
                  <option value="retiro">Retiro</option>
                </select>
              </div>
              <div>
                <label className="tt-label">Importe</label>
                <input className="tt-input" type="number" step="any" value={movementForm.monto} onChange={(e) => setMovementForm({ ...movementForm, monto: e.target.value })} required />
              </div>
              <div style={{ gridColumn: "1 / -1" }}>
                <label className="tt-label">Nota (opcional)</label>
                <input className="tt-input" value={movementForm.nota} onChange={(e) => setMovementForm({ ...movementForm, nota: e.target.value })} />
              </div>
              <div style={{ gridColumn: "1 / -1" }}>
                <button className="tt-btn tt-btn-gold" type="submit">
                  Guardar movimiento
                </button>
              </div>
            </form>
          )}
          {movements.length === 0 ? (
            <div style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--muted)" }}>Sin movimientos de liquidez registrados.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {[...movements].reverse().map((m) => (
                <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: "var(--surface-2)", borderRadius: 7 }}>
                  {m.tipo === "aporte" ? <ArrowUpRight size={14} color="var(--gold)" /> : <ArrowDownRight size={14} color="var(--rose)" />}
                  <span style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--muted)", width: 90 }}>{fmtDate(m.fecha)}</span>
                  <span style={{ fontFamily: "var(--font-mono)", fontSize: 13, color: m.tipo === "aporte" ? "var(--gold)" : "var(--rose)", flex: 1 }}>
                    {m.tipo === "aporte" ? "+" : "-"}
                    {money(m.monto)}
                  </span>
                  <span style={{ fontFamily: "var(--font-body)", fontSize: 12, color: "var(--muted)" }}>{m.nota}</span>
                  <button onClick={() => deleteMovement(m.id)} style={iconBtnStyle} title="Eliminar">
                    <Trash2 size={13} />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function GlobalStyle() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      .tt-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
      .tt-scrollbar::-webkit-scrollbar-thumb { background: #2A3550; border-radius: 4px; }
      .tt-input {
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 8px 10px;
        font-family: var(--font-body);
        font-size: 13px;
        width: 100%;
        outline: none;
        transition: border-color .15s;
      }
      .tt-input:focus { border-color: var(--gold); }
      .tt-label {
        font-family: var(--font-body);
        font-size: 11px;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 5px;
        display: block;
      }
      .tt-btn {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 13px;
        border-radius: 7px;
        padding: 9px 16px;
        cursor: pointer;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: opacity .15s, transform .1s;
      }
      .tt-btn:active { transform: scale(0.98); }
      .tt-btn-gold { background: var(--gold); color: #17110A; }
      .tt-btn-gold:hover { opacity: .9; }
      .tt-btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
      .tt-btn-ghost:hover { background: var(--surface-2); }
      .tt-row:hover { background: var(--surface-2) !important; }
      .tt-th { cursor: pointer; user-select: none; }
      .tt-th:hover { color: var(--text) !important; }
      .tt-spin { animation: tt-spin-anim 0.8s linear infinite; }
      @keyframes tt-spin-anim { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    `}</style>
  );
}
