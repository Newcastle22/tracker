/* ---------- almacenamiento local (localStorage) -----------
   Implementa la misma interfaz que window.storage en Claude.ai,
   así el resto del código no necesita cambios. Los datos se
   guardan en el navegador (por dispositivo/navegador), no en la nube. */
window.storage = {
  async get(key) {
    const raw = localStorage.getItem("tt:" + key);
    if (raw === null) return null;
    return { key, value: raw, shared: false };
  },
  async set(key, value) {
    localStorage.setItem("tt:" + key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    const existed = localStorage.getItem("tt:" + key) !== null;
    localStorage.removeItem("tt:" + key);
    return { key, deleted: existed, shared: false };
  },
  async list(prefix) {
    const p = "tt:" + (prefix || "");
    const keys = Object.keys(localStorage)
      .filter((k) => k.startsWith(p))
      .map((k) => k.slice(3));
    return { keys, prefix, shared: false };
  },
};

/* ---------- gráfico de curva de capital (SVG propio, sin recharts) ---------- */
function EquityChart({ data, baseline, money }) {
  const width = 700,
    height = 220,
    padding = { top: 10, right: 16, bottom: 24, left: 68 };
  if (!data || data.length === 0) return null;
  const values = data.map((d) => d.balance);
  const min = Math.min(baseline, ...values);
  const max = Math.max(baseline, ...values);
  const range = max - min || 1;
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const n = data.length;
  const xStep = n > 1 ? innerW / (n - 1) : 0;
  const points = data.map((d, i) => {
    const x = padding.left + i * xStep;
    const y = padding.top + innerH - ((d.balance - min) / range) * innerH;
    return [x, y];
  });
  const linePath = points.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const baseY = (padding.top + innerH).toFixed(1);
  const areaPath = `${linePath} L${points[points.length - 1][0].toFixed(1)},${baseY} L${points[0][0].toFixed(1)},${baseY} Z`;
  const baselineY = padding.top + innerH - ((baseline - min) / range) * innerH;
  const labelEvery = Math.max(1, Math.ceil(n / 6));
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto", display: "block" }} preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="ttGoldFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#D4A94D" stopOpacity="0.35" />
          <stop offset="100%" stopColor="#D4A94D" stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0, 0.25, 0.5, 0.75, 1].map((f, i) => {
        const y = padding.top + innerH * f;
        const val = max - range * f;
        return (
          <g key={i}>
            <line x1={padding.left} y1={y} x2={width - padding.right} y2={y} stroke="#1D2740" />
            <text x={padding.left - 8} y={y + 3} textAnchor="end" fontSize="9" fontFamily="IBM Plex Mono" fill="#7C8AA0">
              {money(val)}
            </text>
          </g>
        );
      })}
      <line x1={padding.left} y1={baselineY} x2={width - padding.right} y2={baselineY} stroke="#7C8AA0" strokeDasharray="3 3" />
      <path d={areaPath} fill="url(#ttGoldFill)" stroke="none" />
      <path d={linePath} fill="none" stroke="#D4A94D" strokeWidth="2" />
      {points.map((p, i) =>
        i % labelEvery === 0 || i === points.length - 1 ? (
          <text key={"lbl" + i} x={p[0]} y={height - 6} textAnchor="middle" fontSize="9" fontFamily="IBM Plex Mono" fill="#7C8AA0">
            {data[i].fecha}
          </text>
        ) : null
      )}
      {points.map((p, i) => (
        <circle key={"c" + i} cx={p[0]} cy={p[1]} r="2.5" fill="#0B1220" stroke="#D4A94D" strokeWidth="1.5">
          <title>{`${data[i].fecha}: ${money(data[i].balance)}`}</title>
        </circle>
      ))}
    </svg>
  );
}

// Tramos IRPF base del ahorro (ejercicio 2025, declaración 2026). Escala única
// estatal: se aplica igual en toda España, incluidas las Islas Canarias, para
// ganancias y pérdidas patrimoniales por venta de acciones.
const TAX_BRACKETS = [
  { upTo: 6000, rate: 0.19 },
  { upTo: 50000, rate: 0.21 },
  { upTo: 200000, rate: 0.23 },
  { upTo: 300000, rate: 0.27 },
